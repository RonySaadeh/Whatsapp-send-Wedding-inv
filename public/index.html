<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wedding Invitations Sender</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #fdf6f0;
    --card: #ffffff;
    --accent: #b9716f;
    --accent-dark: #8f4d4b;
    --text: #3a2e2c;
    --muted: #8a7a76;
    --border: #ecdedb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    color: var(--accent-dark);
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.95rem;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    padding: 6px 12px;
    border-radius: 999px;
    background: #f4ece9;
    margin-bottom: 20px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c0392b; }
  .dot.ready { background: #3a9d5d; }
  button {
    font-family: inherit;
    font-size: 1rem;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:disabled { background: #d8c8c5; cursor: not-allowed; }
  .preview {
    margin-top: 20px;
    padding: 16px;
    background: #faf3f0;
    border: 1px dashed var(--border);
    border-radius: 8px;
    white-space: pre-wrap;
    font-size: 0.9rem;
  }
  .count {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
  }
  #log {
    margin-top: 20px;
    background: #201a19;
    color: #e8dcd9;
    border-radius: 8px;
    padding: 14px;
    font-family: 'Consolas', monospace;
    font-size: 0.82rem;
    white-space: pre-wrap;
    max-height: 260px;
    overflow-y: auto;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Wedding Invitations</h1>
    <p class="sub">Sends your custom message to everyone in contacts.csv, from your own WhatsApp number.</p>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking connection…</span>
    </div>

    <div class="preview" id="preview">Loading preview…</div>
    <div class="count" id="count"></div>

    <div style="margin-top:20px;">
      <button id="sendBtn" disabled>Send Invitations</button>
    </div>

    <div id="log"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
